[project]
name = "ubuntu-auto-upgrade"
version = "0.1.0"
description = "Run apt upgrades with optional restart and notifications."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytz==2023.3.post1",
]

[project.optional-dependencies]
mattermost = [
    "requests>=2",
]
slack = [
    "slack-sdk>=3",
]

[dependency-groups]
dev = [
    "types-pytz==2024.1.0.20240203",
]

[tool.uv]
package = false
